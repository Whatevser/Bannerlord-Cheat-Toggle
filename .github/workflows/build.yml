name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      # No game on the runner, so the project falls back to Bannerlord.ReferenceAssemblies.Core
      - name: Build
        run: dotnet build -c Release

      - name: Verify module layout
        shell: pwsh
        run: |
          $root = "out/Modules/CheatToggle"
          $required = "SubModule.xml", "bin/Win64_Shipping_Client/CheatToggle.dll", "bin/Win64_Shipping_Client/CheatToggle.pdb"
          $missing = $required | Where-Object { -not (Test-Path (Join-Path $root $_)) }
          $files = Get-ChildItem $root -Recurse -File | ForEach-Object { $_.FullName.Substring((Resolve-Path $root).Path.Length + 1).Replace('\', '/') + " ($($_.Length) B)" }
          "### Module contents`n" + (($files | ForEach-Object { "- ``$_``" }) -join "`n") | Out-File -Append $env:GITHUB_STEP_SUMMARY
          if ($missing) { Write-Output "::error::Missing from module: $($missing -join ', ')"; exit 1 }
          Write-Output "::notice title=Module contents::$($files -join ' | ')"

      - name: Zip module
        shell: pwsh
        run: Compress-Archive -Path out/Modules/CheatToggle -DestinationPath CheatToggle.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: CheatToggle-${{ github.sha }}
          path: out/Modules/

      # Release when: a v* tag is pushed, or main gets a SubModule.xml version that has no release yet.
      - name: Decide release
        id: rel
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = ([xml](Get-Content SubModule.xml)).Module.Version.value
          $tag = $version
          $release = $false
          if ("${{ github.ref }}".StartsWith("refs/tags/v")) { $tag = "${{ github.ref_name }}"; $release = $true }
          elseif ("${{ github.event_name }}" -eq "push" -and "${{ github.ref }}" -eq "refs/heads/main") {
            gh release view $tag -R "${{ github.repository }}" *> $null
            $release = ($LASTEXITCODE -ne 0)
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "release=$($release.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          Write-Output "::notice title=Release::version $version, tag $tag, release=$release"
          exit 0  # gh's "not found" exit code would otherwise fail the step

      - name: Release
        if: steps.rel.outputs.release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: Cheat Toggle ${{ steps.rel.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: CheatToggle.zip
          generate_release_notes: true
