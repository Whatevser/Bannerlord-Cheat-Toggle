name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # No game on the runner, so the project falls back to Bannerlord.ReferenceAssemblies.Core
      - name: Build
        run: dotnet build -c Release

      - name: Zip module
        shell: pwsh
        run: Compress-Archive -Path out/Modules/CheatToggle -DestinationPath CheatToggle.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CheatToggle-${{ github.sha }}
          path: out/Modules/

      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: CheatToggle.zip
          generate_release_notes: true
